<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Danh sách sản phẩm</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

    <div class="filter-box">

        <form action="/products" method="get">

            <div class="filter-item">

                <label for="keyword">
                    Tên sản phẩm:
                </label>

                <input
                    type="text"
                    id="keyword"
                    name="keyword"
                    placeholder="Nhập tên sản phẩm...">

            </div>

            <div class="filter-item">

                <label for="categoryId">
                    Danh mục:
                </label>

                <select id="categoryId"
                        name="categoryId">

                    <option value="">
                        Tất cả
                    </option>

                    <option value="1">
                        Điện thoại di động
                    </option>

                    <option value="2">
                        Máy tính bảng
                    </option>

                </select>

            </div>


            <div class="filter-item">

                <label for="fromPrice">
                    Giá từ:
                </label>

                <input
                    type="number"
                    id="fromPrice"
                    name="fromPrice"
                    placeholder="Giá thấp nhất">

            </div>

            <div class="filter-item">

                <label for="toPrice">
                    Giá đến:
                </label>

                <input
                    type="number"
                    id="toPrice"
                    name="toPrice"
                    placeholder="Giá cao nhất">

            </div>

            <button type="submit">
                Tìm kiếm / Lọc
            </button>

        </form>

    </div>

    <div class="product-list">

        <div
            class="product"
            th:each="product : ${products}">

            <img
                th:src="@{/images/{image}(image=${product.image})}"
                th:alt="${product.name}"
                width="200">

            <h2 th:text="${product.name}">
                Tên sản phẩm
            </h2>

            <p th:text="${product.description}">
                Mô tả sản phẩm
            </p>

            <p>
                Giá:

                <strong th:text="${product.price}">
                    0
                </strong>

                VNĐ
            </p>

            <a
                th:href="@{/products/{id}(id=${product.id})}"
                class="detail-button">

                Xem chi tiết

            </a>

        </div>

    </div>


    <div th:if="${#lists.isEmpty(products)}">

        <p>
            Không tìm thấy sản phẩm phù hợp.
        </p>

    </div>


</body>

</html>
